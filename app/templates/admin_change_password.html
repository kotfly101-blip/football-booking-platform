
{% extends "base.html" %}

{% block title %}เปลี่ยนรหัสผ่านผู้ดูแลระบบ{% endblock %}

{% block content %}
<h1>เปลี่ยนรหัสผ่าน Admin</h1>

<p>กรุณายืนยันรหัสผ่านปัจจุบันก่อนตั้งรหัสผ่านใหม่</p>

<form method="POST"
      action="{{ url_for('main.admin_change_password') }}">

    <input type="hidden"
           name="csrf_token"
           value="{{ csrf_token }}">

    <div>
        <label for="current_password">รหัสผ่านปัจจุบัน</label>
        <input type="password"
               id="current_password"
               name="current_password"
               autocomplete="current-password"
               required>
    </div>

    <div>
        <label for="new_password">รหัสผ่านใหม่</label>
        <input type="password"
               id="new_password"
               name="new_password"
               autocomplete="new-password"
               minlength="12"
               required>
    </div>

    <div>
        <label for="confirm_password">ยืนยันรหัสผ่านใหม่</label>
        <input type="password"
               id="confirm_password"
               name="confirm_password"
               autocomplete="new-password"
               minlength="12"
               required>
    </div>

    <p>รหัสผ่านใหม่ต้องมีอย่างน้อย 12 ตัวอักษร</p>

    <button type="submit">บันทึกรหัสผ่านใหม่</button>
</form>
{% endblock %}
