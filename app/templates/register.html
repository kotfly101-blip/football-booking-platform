
{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>สมัครสมาชิก</h2>
    <p>Football Booking Platform</p>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        
        <label for="username">ชื่อผู้ใช้</label>
        <input type="text"
               id="username"
               name="username"
               required
               minlength="3"
               maxlength="80">

        <label for="email">อีเมล</label>
        <input type="email"
               id="email"
               name="email"
               required>

        <label for="password">รหัสผ่าน</label>
        <input type="password"
               id="password"
               name="password"
               required
               minlength="8">

        <label for="confirm_password">
            ยืนยันรหัสผ่าน
        </label>
        <input type="password"
               id="confirm_password"
               name="confirm_password"
               required
               minlength="8">

        <button type="submit">
            สมัครสมาชิก
        </button>
    </form>
</div>
{% endblock %}
